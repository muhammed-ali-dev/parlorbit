services:
  - type: web
    name: roomcade
    runtime: docker
    plan: 0.5c-512mb
    healthCheckPath: /readyz
    envVars:
      - key: DATABASE_PATH
        value: /var/data/roomcade.db
      - key: STATIC_DIR
        value: /app/dist
      - key: SECURE_COOKIES
        value: "true"
      - key: ALLOWED_ORIGINS
        fromService:
          type: web
          name: roomcade
          envVarKey: RENDER_EXTERNAL_URL
      - key: DEMO_PASSWORD_REQUIRED
        value: "true"
      - key: DEMO_PASSWORD
        sync: false
      - key: METRICS_TOKEN
        generateValue: true
      - key: EMBEDDING_ENABLED
        value: "false"
      # Optional: add LIVEKIT_URL, LIVEKIT_API_KEY, and LIVEKIT_API_SECRET
      # in the dashboard when enabling audio/video calls. See HOSTING.md.
    disk:
      name: roomcade-data
      mountPath: /var/data
      sizeGB: 1
